services:
  - type: web
    name: nexis-insights
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: MODEL_NAME
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: OMNIROUTE_GATEWAY_URL
        value: https://integrate.api.nvidia.com/v1